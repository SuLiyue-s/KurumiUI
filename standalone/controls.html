<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 主题预置：首帧前写入当前主题 token，防 FOUC 闪烁（由 .tools/patch-theme-boot.js 注入） -->
  <script src="../src/core/theme-boot.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>controls · 全控件陈列 | KurumiUI</title>
<link rel="stylesheet" href="../src/styles/base.css">
<link rel="stylesheet" href="../src/styles/controls.css">
<link rel="stylesheet" href="../src/styles/components.css">
<link rel="stylesheet" href="../src/styles/tooltip.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--kui-bg-0, #08050a); color: var(--kui-text-1, #f5e9ee); font-family: var(--kui-font-family, "Microsoft YaHei", "PingFang SC", sans-serif); }
  .demo-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 18px; border-bottom: 1px solid var(--kui-border, #2a1f26); background: var(--kui-bg-1, #141018); flex-wrap: wrap; }
  .demo-bar__title { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .demo-bar__title strong { font-size: 16px; letter-spacing: .04em; }
  .demo-tag { padding: 2px 8px; border-radius: 999px; font-size: 11px; color: var(--kui-accent-2, #d4af37); border: 1px solid var(--kui-accent-2, #d4af37); }
  .demo-bar__ops { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .demo-bar select { background: var(--kui-control-bg, #1b141c); color: var(--kui-text-1, #f5e9ee); border: 1px solid var(--kui-control-border, #3a2b33); border-radius: 6px; height: 30px; padding: 0 8px; outline: none; }
  .demo-nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .demo-nav a { color: var(--kui-text-2, #cbb8c0); text-decoration: none; font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid transparent; }
  .demo-nav a:hover { color: var(--kui-text-1); border-color: var(--kui-accent); }
  .demo-nav a.is-current { color: var(--kui-text-1); border-color: var(--kui-accent); background: var(--kui-accent-soft); font-weight: 600; }
  .demo-main { padding: 18px; display: grid; gap: 14px; }
  .demo-panel { background: var(--kui-bg-1, #141018); border: 1px solid var(--kui-border, #2a1f26); border-radius: var(--kui-radius-lg, 10px); padding: 14px; }
  .demo-panel__title { font-size: 13px; color: var(--kui-accent-2, #d4af37); margin: 0 0 8px; letter-spacing: .08em; }
  .demo-panel__desc { font-size: 12px; color: var(--kui-text-3, #9a8b93); margin: 0 0 12px; }
  .demo-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .demo-group > * { min-width: 0; }
  .demo-taglist { display: flex; gap: 6px; flex-wrap: wrap; }
  .demo-taglist span { font-family: var(--kui-font-mono, Consolas, monospace); font-size: 11px; color: var(--kui-accent-3, #8ee6d6); background: var(--kui-bg-2, #1d141d); border: 1px solid var(--kui-border, #2a1f26); border-radius: 4px; padding: 2px 6px; }
  .demo-ops { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .demo-btn { height: 30px; padding: 0 12px; cursor: pointer; font-size: 12px; color: var(--kui-text-1, #f5e9ee); background: var(--kui-control-bg, #1b141c); border: 1px solid var(--kui-control-border, #3a2b33); border-radius: 6px; }
    .demo-btn:not(.demo-btn--primary):hover { border-color: var(--kui-accent); color: var(--kui-text-1); background: var(--kui-control-bg-hover); }
  .demo-log { margin: 0; padding: 10px 12px; min-height: 96px; max-height: 180px; overflow: auto; background: var(--kui-bg-0, #08050a); border: 1px dashed var(--kui-border, #2a1f26); border-radius: 6px; font-family: var(--kui-font-mono, Consolas, monospace); font-size: 11px; line-height: 1.7; color: var(--kui-text-2, #cbb8c0); white-space: pre-wrap; }
  .demo-log .is-err { color: var(--kui-danger, #ff5c7a); }
  .demo-error { color: var(--kui-danger, #ff5c7a); font-size: 12px; padding: 10px; }
</style>
</head>
<body data-kui-auto="false">
<header class="demo-bar">
  <div class="demo-bar__title">
    <span class="demo-tag">独立渲染</span>
    <strong>controls</strong>
    <span>全部控件陈列 · 按钮 / 输入 / 选择 / 日期 / 展示 / 数据 / 布局</span>
  </div>
  <div class="demo-bar__ops">
    <nav class="demo-nav" id="demoNav"></nav>
    <label>主题 <select data-kui-native id="kuiThemeSwitch"><option value="kurumi">绯红刻刻帝</option></select></label>
  </div>
</header>
<main class="demo-main">
  <section class="demo-panel">
    <h2 class="demo-panel__title">已注册控件类型（KUI.registry.types()）</h2>
    <p class="demo-panel__desc">下面这些 type 名就是 JSON 里 <code>"type"</code> 的合法取值（来自契约 §6）。共 <strong id="countTypes">0</strong> 个已注册类型。</p>
    <div class="demo-taglist" id="typeList"><span>加载中…</span></div>
    <div class="demo-ops">
      <button class="demo-btn" id="btnReload">重新读取 controls.json</button>
      <button class="demo-btn" id="btnLog">打印 registry 列表到控制台</button>
    </div>
  </section>
  <div id="groupsHost"><div class="demo-error">正在加载 config/demos/controls.json …</div></div>
  <section class="demo-panel">
    <h2 class="demo-panel__title">日志</h2>
    <pre class="demo-log" id="demoLog">// 操作日志</pre>
  </section>
</main>
<script src="embedded.js"></script>
<script src="../src/core/kui-all.js" data-kui-profile="standalone"></script>
<script>
(function () {
  'use strict';
  var KUI = window.KUI;
  var logEl = document.getElementById('demoLog');
  var groupsHost = document.getElementById('groupsHost');
  var PAGES = ['menu', 'menunav', 'tabs', 'dialog', 'toast', 'form', 'controls', 'theme', 'no-shell', 'boot'];

  function log(text, isError) {
    var line = document.createElement('div');
    if (isError) line.className = 'is-err';
    line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function nav() {
    var box = document.getElementById('demoNav');
    for (var i = 0; i < PAGES.length; i++) {
      var a = document.createElement('a');
      a.href = PAGES[i] + '.html';
      a.textContent = PAGES[i];
      if (PAGES[i] === 'controls') a.className = 'is-current';
      box.appendChild(a);
    }
  }
  function fillThemeSelect() {
    var sel = document.getElementById('kuiThemeSwitch');
    var list = (KUI.theme && KUI.theme.list) ? KUI.theme.list() : [];
    if (!list.length) return;
    sel.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      var opt = document.createElement('option');
      opt.value = list[i].id;
      opt.textContent = list[i].name + '（' + list[i].id + '）';
      sel.appendChild(opt);
    }
    sel.value = (KUI.theme.currentId && KUI.theme.currentId()) || list[0].id;
    sel.onchange = function () { KUI.theme.apply(sel.value); };
  }
  function initTheme() {
    KUI.config.load('themes').then(function (data) {
      if (data && data.themes && KUI.theme.init) {
        KUI.theme.init(data, { fallbackId: 'kurumi', storageKey: 'kui-demo-theme', persist: true, silent: true });
      }
      fillThemeSelect();
    })['catch'](function () { fillThemeSelect(); });
  }

  function showTypes() {
    var types = (KUI.registry && KUI.registry.types) ? KUI.registry.types() : [];
    var box = document.getElementById('typeList');
    box.innerHTML = '';
    for (var i = 0; i < types.length; i++) {
      var span = document.createElement('span');
      span.textContent = types[i];
      box.appendChild(span);
    }
    document.getElementById('countTypes').textContent = types.length;
    log('registry 已注册 ' + types.length + ' 个类型：' + types.join(', '));
  }

  function renderGroups(data) {
    groupsHost.innerHTML = '';
    var groups = (data && data.groups) || [];
    if (!groups.length) { groupsHost.innerHTML = '<div class="demo-error">controls.json 里没有 groups 数组。</div>'; return; }
    for (var i = 0; i < groups.length; i++) {
      var g = groups[i];
      var panel = document.createElement('section');
      panel.className = 'demo-panel';
      var title = document.createElement('h2');
      title.className = 'demo-panel__title';
      title.textContent = (g.title || g.id) + '（' + (g.nodes ? g.nodes.length : 0) + '）';
      panel.appendChild(title);
      if (g.desc) {
        var desc = document.createElement('p');
        desc.className = 'demo-panel__desc';
        desc.textContent = g.desc;
        panel.appendChild(desc);
      }
      var grid = document.createElement('div');
      grid.className = 'demo-group';
      var nodes = g.nodes || [];
      var failed = 0;
      for (var j = 0; j < nodes.length; j++) {
        var el = null;
        try { el = KUI.renderNode(nodes[j], null); } catch (e) { el = null; failed++; }
        if (el) grid.appendChild(el);
      }
      if (failed) log('分组「' + (g.title || g.id) + '」有 ' + failed + ' 个节点渲染异常', true);
      panel.appendChild(grid);
      groupsHost.appendChild(panel);
    }
    log('已渲染 ' + groups.length + ' 组控件陈列');
  }

  function load(force) {
    if (force && KUI.config.clear) KUI.config.clear('demos/controls');
    KUI.config.load('demos/controls', force ? { force: true } : null).then(function (data) {
      if (!data) { groupsHost.innerHTML = '<div class="demo-error">未找到 config/demos/controls.json，请先运行 npm run build:config。</div>'; return; }
      renderGroups(data);
    })['catch'](function (err) { log('加载失败：' + (err && err.message ? err.message : err), true); });
  }

  document.getElementById('btnReload').onclick = function () { load(true); showTypes(); };
  document.getElementById('btnLog').onclick = function () {
    var list = (KUI.registry && KUI.registry.list) ? KUI.registry.list() : [];
    if (window.console && console.table) console.table(list);
    log('已打印 ' + list.length + ' 条 registry 记录到控制台');
  };

  nav();
  initTheme();
  showTypes();
  load(false);
})();
</script>
</body>
</html>

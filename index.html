<!DOCTYPE html>
<html lang="zh-CN" data-kui-boot="loading">
<head>
  <!-- 主题预置：首帧前写入当前主题 token，防 FOUC 闪烁（由 .tools/patch-theme-boot.js 注入） -->
  <script src="src/core/theme-boot.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#08050a">
  <title>KurumiUI · 科技未来 × 时崎狂三</title>
  <link rel="icon" href="data:,">

  <!-- 样式：基础 token / 元素控件 / 框架组件（顺序固定，见 docs/00-contract.md §4） -->
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/controls.css">
  <link rel="stylesheet" href="src/styles/components.css">
<link rel="stylesheet" href="src/styles/tooltip.css">

  <!-- 启动层样式：组件 src/components/boot.js 渲染；组件缺位时静态骨架仍可降级显示 -->
  <link rel="stylesheet" href="src/styles/boot.css">
</head>
<body>

  <!-- 应用挂载点：脚本会自动在 #kui-app 内构建 menu + menunav + tabs -->
  <div id="kui-app" data-kui-app="true"></div>

  <!-- 启动层 -->
  <div id="kui-boot" class="kui-boot" role="status" aria-live="polite">
    <div class="kui-boot__inner">
      <div class="kui-boot__logo" aria-hidden="true"></div>
      <div class="kui-boot__title">KurumiUI</div>
      <div class="kui-boot__sub">CONFIG-DRIVEN UI FRAMEWORK</div>
      <div class="kui-boot__bar"><span></span></div>
      <div class="kui-boot__text" data-boot-text>正在加载界面配置…</div>
    </div>
  </div>

  <noscript>
    <div style="padding:24px;color:#ff8f9c">KurumiUI 需要启用 JavaScript 才能运行。</div>
  </noscript>

  <!--
    加载顺序（见 docs/00-contract.md §4）：
      1. 配置兜底包（file:// 打开时 fetch 不到 JSON，用它兜底）
      2. core：命名空间 / 图标 / 注册表 / 配置 / 主题
      3. 元素控件（controls/index.js 会自动按顺序加载全部控件脚本）
      4. 表单引擎（含 deps 联动）
      5. 框架组件：menu / menunav / tabs / dialog / toast / boot（加载层）
      6. app-shell 与启动器
  -->
<script src="src/core/kui-all.js" data-kui-profile="app"></script>




  <!-- 每个框架组件的业务函数文件：JSON 只写函数名与入参，不写函数 -->

</body>
</html>
